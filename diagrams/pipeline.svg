<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1230" viewBox="0 0 900 1230" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box  { fill: #ECECFF; stroke: #9370DB; stroke-width: 1.5; }
      .a    { fill: #E8F4FD; stroke: #3B82C4; stroke-width: 1.5; }
      .b    { fill: #FDF1E6; stroke: #D9822B; stroke-width: 1.5; }
      .eval { fill: #E9F7EF; stroke: #2E9D5B; stroke-width: 1.5; }
      .edge { fill: none; stroke: #333; stroke-width: 1.5; }
      .t    { text-anchor: middle; dominant-baseline: middle; fill: #222; }
      .lbl  { text-anchor: middle; dominant-baseline: middle; fill: #444; font-size: 13; }
      .bold { font-weight: bold; }
    </style>
  </defs>
  <rect width="900" height="1230" fill="#fff"/>

  <!-- A: Dataset prep -->
  <rect class="box" x="290" y="20" width="320" height="50" rx="4"/>
  <text class="t" x="450" y="45">Dataset Prep: 15 GSM8K Questions</text>
  <path class="edge" d="M450,70 L450,108"/>

  <!-- B: Inject peers -->
  <rect class="box" x="310" y="110" width="280" height="50" rx="25"/>
  <text class="t" x="450" y="135">Inject Fake Peer Answers</text>
  <path class="edge" d="M450,160 L450,178"/>

  <!-- C: Reputation decision -->
  <polygon class="box" points="450,180 610,235 450,290 290,235"/>
  <text class="t" x="450" y="226">Apply Reputation</text>
  <text class="t" x="450" y="246">Scenarios</text>

  <!-- C -> D (three labelled edges) -->
  <path class="edge" d="M290,235 Q230,330 370,378"/>
  <path class="edge" d="M450,290 L450,378"/>
  <path class="edge" d="M610,235 Q670,330 530,378"/>
  <rect x="180" y="308" width="110" height="20" fill="#fff"/>
  <text class="lbl" x="235" y="318">No Reputation</text>
  <rect x="388" y="324" width="124" height="20" fill="#fff"/>
  <text class="lbl" x="450" y="334">High-Rep Majority</text>
  <rect x="610" y="308" width="122" height="20" fill="#fff"/>
  <text class="lbl" x="671" y="318">High-Rep Minority</text>

  <!-- D: 6 conditions -->
  <rect class="box" x="300" y="380" width="300" height="50" rx="4"/>
  <text class="t" x="450" y="405">6 Experimental Conditions</text>
  <path class="edge" d="M450,430 L450,468"/>

  <!-- E: Target agent simulation (subroutine) -->
  <rect class="box" x="300" y="470" width="300" height="50" rx="2"/>
  <line x1="312" y1="470" x2="312" y2="520" stroke="#9370DB" stroke-width="1.5"/>
  <line x1="588" y1="470" x2="588" y2="520" stroke="#9370DB" stroke-width="1.5"/>
  <text class="t" font-weight="bold" x="450" y="495">Target Agent Simulation</text>

  <!-- E -> F, G -->
  <path class="edge" d="M450,520 L450,545 L250,545 L250,568"/>
  <path class="edge" d="M450,545 L650,545 L650,568"/>

  <!-- F / G: models -->
  <rect class="a" x="100" y="570" width="300" height="60" rx="4"/>
  <text class="t" font-weight="bold" x="250" y="590">Model A: claude-opus-5-5</text>
  <text class="t" x="250" y="612">Medium Effort</text>
  <rect class="b" x="500" y="570" width="300" height="60" rx="4"/>
  <text class="t" font-weight="bold" x="650" y="590">Model B: claude-haiku-5-5</text>
  <text class="t" x="650" y="612">Low Effort</text>
  <path class="edge" d="M250,630 L250,668"/>
  <path class="edge" d="M650,630 L650,668"/>

  <!-- H / I: Round 1 -->
  <rect class="a" x="100" y="670" width="300" height="50" rx="4"/>
  <text class="t" x="250" y="695">Round 1: Independent Answer</text>
  <rect class="b" x="500" y="670" width="300" height="50" rx="4"/>
  <text class="t" x="650" y="695">Round 1: Independent Answer</text>
  <path class="edge" d="M250,720 L250,758"/>
  <path class="edge" d="M650,720 L650,758"/>

  <!-- J / K: Round 2 -->
  <rect class="a" x="70" y="760" width="360" height="50" rx="4"/>
  <text class="t" x="250" y="785">Round 2: Show Peer Answers &amp; Reputations</text>
  <rect class="b" x="470" y="760" width="360" height="50" rx="4"/>
  <text class="t" x="650" y="785">Round 2: Show Peer Answers &amp; Reputations</text>
  <path class="edge" d="M250,810 L250,848"/>
  <path class="edge" d="M650,810 L650,848"/>

  <!-- L / M: Final answers -->
  <rect class="a" x="110" y="850" width="280" height="50" rx="25"/>
  <text class="t" x="250" y="875">Final Answer – Model A</text>
  <rect class="b" x="510" y="850" width="280" height="50" rx="25"/>
  <text class="t" x="650" y="875">Final Answer – Model B</text>

  <!-- L, M -> N -->
  <path class="edge" d="M250,900 L250,920 L450,920 L450,936"/>
  <path class="edge" d="M650,900 L650,920 L450,920"/>

  <!-- N: Evaluation (cylinder) -->
  <path class="eval" d="M310,950 L310,1010 A140,12 0 0 0 590,1010 L590,950"/>
  <ellipse class="eval" cx="450" cy="950" rx="140" ry="12"/>
  <text class="t" font-weight="bold" x="450" y="985">Evaluation &amp; Analysis</text>
  <path class="edge" d="M450,1022 L450,1058"/>

  <!-- O: Metrics -->
  <rect class="eval" x="220" y="1060" width="460" height="50" rx="4"/>
  <text class="t" x="450" y="1085">Calculate Metrics: Accuracy, Switching Rate, Conformity</text>
  <path class="edge" d="M450,1110 L450,1148"/>

  <!-- P: Compare -->
  <rect class="eval" x="250" y="1150" width="400" height="50" rx="4"/>
  <text class="t" x="450" y="1175">Compare Model A vs Model B Performance</text>
  <!-- arrowheads -->
  <polygon points="444,98 456,98 450,108" fill="#333"/>
  <polygon points="444,168 456,168 450,178" fill="#333"/>
  <polygon points="444,368 456,368 450,378" fill="#333"/>
  <polygon points="444,458 456,458 450,468" fill="#333"/>
  <polygon points="244,558 256,558 250,568" fill="#333"/>
  <polygon points="644,558 656,558 650,568" fill="#333"/>
  <polygon points="244,658 256,658 250,668" fill="#333"/>
  <polygon points="644,658 656,658 650,668" fill="#333"/>
  <polygon points="244,748 256,748 250,758" fill="#333"/>
  <polygon points="644,748 656,748 650,758" fill="#333"/>
  <polygon points="244,838 256,838 250,848" fill="#333"/>
  <polygon points="644,838 656,838 650,848" fill="#333"/>
  <polygon points="444,926 456,926 450,936" fill="#333"/>
  <polygon points="444,1048 456,1048 450,1058" fill="#333"/>
  <polygon points="444,1138 456,1138 450,1148" fill="#333"/>
  <polygon points="360,368 372,374 362,382" fill="#333"/>
  <polygon points="540,368 528,374 538,382" fill="#333"/>
</svg>
